services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/autoria
      - JWT_SECRET=secret_key
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongo
    networks:
      - autoria-network

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - autoria-network

volumes:
  mongo-data:

networks:
  autoria-network:
    driver: bridge
